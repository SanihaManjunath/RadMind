<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RadMind – Live Cyber Attack Map</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- 🔥 TOP HUD BAR -->
  <div id="top-bar">
    <div id="header">
      <h1>RADMIND</h1>
      <p>Live Cyber Threat Intelligence</p>
    </div>
  </div>

  <!-- 🔥 TOP TARGETS -->
  <div id="top-targets">
    <h3>Top Targets</h3>
    <ul id="targets-list"></ul>
  </div>

  <!-- 🕒 LIVE ATTACK FEED -->
  <div id="attack-feed">
    <h3>Live Attack Feed</h3>
    <ul id="feed-list"></ul>
  </div>

  <div id="globe-container"></div>

  <div id="legend">
    <div><span class="ddos"></span>DDoS</div>
    <div><span class="phishing"></span>Phishing</div>
    <div><span class="malware"></span>Malware</div>
    <div><span class="bruteforce"></span>Brute Force</div>
    <div><span class="ransomware"></span>Ransomware</div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <!-- App -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
