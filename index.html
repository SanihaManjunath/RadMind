<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RadMind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LEFT -->
<div class="panel left">
  <div class="box">
    <h3>ATTACK MAP</h3>
    <p>DDoS</p>
    <p>Phishing</p>
    <p>Malware</p>
    <p>Brute Force</p>
    <p>Ransomware</p>
  </div>

  <div class="box">
    <h3>GLOBAL STATS</h3>
    <p>0 Attacks Today</p>
    <p>0 Attacks in Progress</p>
    <p>0 Countries Affected</p>
  </div>

  <div class="box">
    <h3>REGION ALERTS</h3>
  </div>
</div>

<!-- RIGHT -->
<div class="panel right">
  <div class="box">
    <h3>TOP TARGETS</h3>
  </div>

  <div class="box">
    <h3>ATTACK TIMELINE</h3>
  </div>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="main.js"></script>

</body>
</html>
